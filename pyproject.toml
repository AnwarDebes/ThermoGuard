[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermoguard"
version = "0.1.0"
description = "Real-time hyperlocal indoor heat risk forecasting for vulnerable housing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Anwar Debes", email = "anwar@uia.no"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["thermoguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
